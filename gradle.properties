# Gradle properties
# Required on this machine: Java 23.0.1 on Windows has a NIO bug where PipeImpl
# tries Unix domain sockets for loopback but fails. Setting a short TEMP path
# (e.g. TMPDIR=/c/tmp TEMP=/c/tmp TMP=/c/tmp before ./gradlew) is the workaround.
# Run builds with: TMPDIR=/c/tmp TEMP=/c/tmp TMP=/c/tmp ./gradlew <task>
