# Database
spring.datasource.url=${DOCUMORPH_DB_URL:jdbc:postgresql://localhost:5432/DocuMorph_db}
spring.datasource.username=${DOCUMORPH_DB_USERNAME:postgres}
spring.datasource.password=${DOCUMORPH_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${DOCUMORPH_JWT_SECRET}
app.jwt.expiration=${DOCUMORPH_JWT_EXPIRATION:86400000}

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=${DOCUMORPH_UPLOAD_DIR:./uploads}

python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}