# Database
spring.datasource.url=${DOCUMORPH_DB_URL:jdbc:postgresql://localhost:5432/DocuMorph_db}
spring.datasource.username=${DOCUMORPH_DB_USERNAME:postgres}
spring.datasource.password=${DOCUMORPH_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${DOCUMORPH_JWT_SECRET}
app.jwt.expiration=${DOCUMORPH_JWT_EXPIRATION:86400000}

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=${DOCUMORPH_UPLOAD_DIR:./uploads}

python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}
# shared secret the pipeline requires on every call except /health
python.service.api-key=${PIPELINE_API_KEY:}
# Response compression - ~4.6x on JS/CSS/JSON, matters over a tunnel
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Static asset caching - avoids a revalidation round trip per asset per page
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.cache-public=true
